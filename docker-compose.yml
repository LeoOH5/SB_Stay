services:
  db:
    image: postgres:16-alpine
    container_name: sbstay-db
    environment:
      POSTGRES_USER: sbstay
      POSTGRES_PASSWORD: sbstay
      POSTGRES_DB: sbstay
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbstay -d sbstay"]
      interval: 5s
      timeout: 3s
      retries: 10
